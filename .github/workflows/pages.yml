name: Publish Home Plan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: home-plan-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and regenerate offline document
        run: |
          npm run check
          python3 build.py
          git diff --exit-code -- index.html
      - name: Prepare public-only site
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          touch .pages/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
